[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/trovix-oss/claude-consult"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-std", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
dirs = "6"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.37"
tempfile = "3"
wiremock = "0.6"
roxmltree = "0.21"
rmcp = { version = "3.4.1", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
rpassword = "7.5"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

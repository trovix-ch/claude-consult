[package]
name = "consult-tui"
description = "Shared terminal UI pieces of claude-consult: theme, panel picker, text input, confirm, step log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "consult_tui"
path = "src/lib.rs"

[dependencies]
consult-core = { path = "../consult-core" }
# ratatui re-exports crossterm 0.29 as ratatui::crossterm; a separate crossterm
# dependency could resolve to another version and bring a second, incompatible
# event type.
ratatui = { workspace = true }
rpassword = { workspace = true }
indexmap = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
